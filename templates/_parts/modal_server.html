{# 服务器添加 / 编辑弹窗。类名一律 wb- 前缀，绝不叫 .modal（会撞 Tabler 的 display:none!important） #}
<div class="wb-mbx" id="mbx-server" hidden>
  <div class="wb-mbx-card">
    <div class="wb-mbx-hd">
      <h2 id="srv-title">添加服务器</h2>
      <button class="wb-iconbtn x" type="button" data-mbx-close aria-label="关闭">✕</button>
    </div>

    <div class="wb-mbx-bd">
      <input type="hidden" id="srv-id">

      {# 名字放最前面：「这台到底是哪台」比「IP 是多少」更需要一眼看到。
         备用名（备注）跟它并排 —— 原来藏在私钥口令那一排的最右边，没人找得到。 #}
      <div class="wb-form2">
        <div>
          <label class="wb-lab" for="srv-name">显示名</label>
          <input class="wb-f" id="srv-name" placeholder="好记的名字，比如 腾讯云-热点" autocomplete="off">
        </div>
        <div>
          <label class="wb-lab" for="srv-note">备用名 / 备注</label>
          <input class="wb-f" id="srv-note" placeholder="跑什么服务、找谁续费…" autocomplete="off">
        </div>
      </div>

      <div class="wb-form2">
        <div>
          <label class="wb-lab" for="srv-grp">分组（可选）</label>
          <input class="wb-f" id="srv-grp" placeholder="生产 / 测试" autocomplete="off">
        </div>
      </div>

      <div class="wb-form3">
        <div>
          <label class="wb-lab" for="srv-host">主机</label>
          <input class="wb-f" id="srv-host" placeholder="192.168.1.10 或 example.com" autocomplete="off">
        </div>
        <div>
          <label class="wb-lab" for="srv-port">端口</label>
          <input class="wb-f" id="srv-port" value="22" inputmode="numeric">
        </div>
        <div>
          <label class="wb-lab" for="srv-user">用户名</label>
          <input class="wb-f" id="srv-user" value="root" autocomplete="off">
        </div>
      </div>

      <div class="wb-form2">
        <div>
          <label class="wb-lab" for="srv-auth">认证方式</label>
          <select class="wb-f" id="srv-auth">
            <option value="password">密码</option>
            <option value="key_path">私钥文件（填路径）</option>
            <option value="key_content">私钥内容（粘贴）</option>
            <option value="agent">SSH Agent</option>
          </select>
        </div>
        <div>
          <label class="wb-lab" for="srv-jump">跳板机（可选）</label>
          <input class="wb-f" id="srv-jump" placeholder="user@bastion:22" autocomplete="off">
        </div>
      </div>

      <label class="wb-lab" for="srv-secret">密码 / 私钥<span id="srv-secret-hint"></span></label>
      <textarea class="wb-f" id="srv-secret" rows="3" placeholder="编辑时留空 = 不修改已保存的凭据"></textarea>

      <div class="wb-form2">
        <div>
          <label class="wb-lab" for="srv-passphrase">私钥口令（有就填）</label>
          <input class="wb-f" id="srv-passphrase" type="password" autocomplete="new-password">
        </div>
      </div>

      <div class="wb-form3">
        <div>
          <label class="wb-lab" for="srv-am">内存阈值 %</label>
          <input class="wb-f" id="srv-am" value="85" inputmode="numeric">
        </div>
        <div>
          <label class="wb-lab" for="srv-ad">磁盘阈值 %</label>
          <input class="wb-f" id="srv-ad" value="90" inputmode="numeric">
        </div>
        <div>
          <label class="wb-lab" for="srv-al">负载阈值</label>
          <input class="wb-f" id="srv-al" value="4.0" inputmode="decimal">
        </div>
      </div>

      <label class="wb-checkline">
        <input type="checkbox" id="srv-legacy">
        <span>兼容老服务器（连不上并提示「kex 算法」时再打开）</span>
      </label>

      <div class="wb-test-result" id="srv-test-result" hidden></div>
    </div>

    <div class="wb-mbx-ft">
      <button class="wb-btn" type="button" id="srv-test">测试连接</button>
      <button class="wb-btn" type="button" data-mbx-close>取消</button>
      <button class="wb-btn pri" type="button" id="srv-save">保存</button>
    </div>
  </div>
</div>
